<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fun Out Agon 2026</title>
<style>
body{margin:0;font-family:Inter,Arial;background:#f6f1e8;color:#333}
.timeline{max-width:420px;margin:auto;padding:20px}
.card{background:white;border-radius:16px;padding:12px;margin:20px 0;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.title{font-weight:900;font-size:18px}
.time{font-size:12px;opacity:.6}
.note{font-style:italic;margin-top:6px}
.badge{display:inline-block;padding:4px 8px;border-radius:10px;font-size:12px;margin-top:8px}
.ok{background:#c7eac7}
.tendu{background:#ffd9a3}
</style>
</head>
<body>
<div class="timeline">
<h1>Fun Out Agon 2026</h1>

<div class="card">
<div class="time">Jeudi 19h</div>
<div class="title">Arrivée</div>
<div class="note">Les sacs tombent. Les verres se remplissent.</div>
<span class="badge ok">OK</span>
</div>

<div class="card">
<div class="time">Jeudi 20h</div>
<div class="title">BBQ</div>
<div class="note">On tente dehors… on verra.</div>
<span class="badge tendu">TENDU</span>
</div>

<div class="card">
<div class="time">Vendredi 14h</div>
<div class="title">Coques</div>
<div class="note">Objectif : apéro mérité</div>
</div>

<div class="card">
<div class="time">Samedi</div>
<div class="title">Vote</div>
<div class="note">Le groupe vote, la météo décide</div>
</div>

<div class="card">
<div class="time">Dimanche</div>
<div class="title">Retour</div>
<div class="note">Les souvenirs restent</div>
</div>

</div>
</body>
</html>
